<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Inspo</title>
<meta name="description" content="A personal collection of favorite artwork and design references.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#222; --muted:#767676; --line:#dcdcdc; --panel:#f2f2f2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111; --ink:#ececec; --muted:#8f8f8f; --line:#2e2e2e; --panel:#1b1b1b; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111; --ink:#ececec; --muted:#8f8f8f; --line:#2e2e2e; --panel:#1b1b1b; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans JP","Hiragino Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit;border-radius:0}
::selection{background:var(--ink);color:var(--bg)}
.wrap{max-width:1680px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 28px}}
.label{font-size:13px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.linkbtn:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* header */
.site-head{border-bottom:1px solid var(--line)}
.util{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px;font-size:15px}
.util .right{margin-left:auto;display:flex;align-items:center;gap:22px;color:var(--muted);font-size:14px}
.live{display:inline-flex;align-items:center;gap:7px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.live.off i{background:none;border:1px solid var(--muted)}
.searchicon{display:inline-flex;color:var(--ink)}
.searchicon svg{width:21px;height:21px}
.nav{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;padding-top:2px;padding-bottom:22px;font-size:22px}
.nav > :nth-child(1){justify-self:start}
.nav > :nth-child(2),.nav > :nth-child(4){justify-self:center}
.nav > :nth-child(5){justify-self:end}
.nav .linkbtn[aria-current="true"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.mark{font-size:48px;font-weight:800;letter-spacing:-.045em;line-height:1;padding:0 24px}
.mark:hover{text-decoration:none}
@media (max-width:860px){
  .util .stats-text{display:none}
  .nav{grid-template-columns:repeat(4,auto);justify-content:space-between;font-size:16px;row-gap:14px}
  .nav .mark{grid-column:1/-1;grid-row:1;justify-self:center;font-size:40px;padding:0}
  .nav > :nth-child(2),.nav > :nth-child(4),.nav > :nth-child(5){justify-self:auto}
}

/* hero: picture on white | text on gray */
.hero{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.hero[hidden]{display:none}
.hero-img{padding:72px 44px 72px 28px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hero-img img{display:block;max-width:100%;max-height:68vh;object-fit:contain}
.hero-img .ph{width:min(420px,100%)}
.hero-side{background:var(--panel);display:flex;align-items:center;padding:72px 44px}
.hero-side .t{display:block;font-size:clamp(26px,2.4vw,36px);line-height:1.18;font-weight:400;letter-spacing:-.015em;margin:18px 0 10px}
.hero-side .by{font-size:18px;color:var(--muted);margin:0}
.hero-side .desc{font-size:16px;max-width:30em;margin:24px 0 0}
.hero-side .more{display:inline-block;margin-top:28px;font-size:16px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero-img{padding:28px 16px}
  .hero-img img{max-height:56vh}
  .hero-side{padding:36px 16px 44px}
}

/* collection heading + controls */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-top:64px;padding-bottom:6px}
h1{font-size:clamp(28px,3vw,40px);font-weight:400;letter-spacing:-.02em;line-height:1.1;margin:0}
.sec-head .count-all{color:var(--muted);font-size:16px}
.controls{background:var(--bg);padding:18px 0 14px;border-bottom:1px solid var(--line)}
@media (min-width:720px){.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}}
.row{display:flex;gap:12px 32px;flex-wrap:wrap;align-items:flex-end}
.row select{flex:0 1 auto}
@media (max-width:540px){.row select{flex:1 1 0;min-width:0}}
.search{flex:1 1 260px;min-width:0;padding:8px 0;border:0;border-bottom:1px solid var(--ink);background:transparent;outline:none;font-size:17px}
.search::placeholder{color:var(--muted)}
select{padding:8px 2px;border:0;border-bottom:1px solid var(--ink);background:transparent;max-width:100%;cursor:pointer;font-size:15px}
select option{background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:6px 20px;flex-wrap:wrap;margin-top:16px}
.chip{border:0;background:none;padding:0;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip small{font-size:11px;margin-left:3px;vertical-align:super}
.chip[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.chip.more{color:var(--ink)}
.result-line{font-size:14px;color:var(--muted);margin-top:10px;min-height:1.45em}
.result-line button{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}

/* masonry grid: pictures keep their own shape */
main{padding:48px 0 96px}
.grid{columns:4 240px;column-gap:40px}
@media (max-width:540px){.grid{columns:2;column-gap:16px}}
.card{display:block;width:100%;break-inside:avoid;margin:0 0 60px;padding:0;border:0;background:none;text-align:left;cursor:pointer;position:relative}
@media (max-width:540px){.card{margin-bottom:36px}}
.card:focus-visible{outline:1px solid var(--ink);outline-offset:6px}
.card .pic{display:block}
.card .pic img{display:block;width:100%;height:auto;transition:opacity .2s ease}
.card:hover .pic img{opacity:.85}
.card .meta{display:block;padding-top:16px}
.card .t{display:block;font-size:19px;line-height:1.3;font-weight:400;letter-spacing:-.01em}
.card:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.card .c{display:block;font-size:17px;color:var(--muted);margin-top:3px}
@media (max-width:540px){.card .t{font-size:16px}.card .c{font-size:14px}}
.badge,.count{position:absolute;top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px}
.badge{left:10px;background:var(--ink);color:var(--bg)}
.count{right:10px;background:var(--bg);color:var(--ink)}
.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;padding:16px;text-align:center;color:var(--muted);font-size:13px;background:var(--panel)}
.empty,.notice{color:var(--muted);padding:60px 0}
.notice code,footer code{font:13px/1 ui-monospace,Menlo,monospace}

/* detail: picture on white | text on gray */
dialog{border:0;padding:0;margin:0;background:var(--bg);color:var(--ink);width:100vw;height:100dvh;max-width:none;max-height:none}
dialog::backdrop{background:var(--bg)}
.detail{display:grid;grid-template-columns:1fr;height:100dvh}
@media (min-width:900px){.detail{grid-template-columns:minmax(0,1fr) minmax(360px,1fr)}}
@media (max-width:899px){.detail{overflow-y:auto;height:auto;max-height:100dvh}}
.stage{background:var(--bg);display:flex;flex-direction:column;min-height:0}
.stage .main-img{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 44px 24px 28px;min-height:280px}
.stage .main-img img{max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;display:block}
@media (max-width:899px){.stage .main-img{padding:20px 16px}.stage .main-img img{max-height:60dvh}}
.stage .ph{width:100%;max-width:420px}
.thumbs{display:flex;gap:12px;padding:0 44px 14px 28px;overflow-x:auto}
@media (max-width:899px){.thumbs{padding:0 16px 14px}}
.thumbs button{flex:0 0 auto;width:56px;height:56px;padding:0;border:0;outline:1px solid transparent;outline-offset:3px;background:var(--panel);cursor:pointer}
.thumbs button[aria-current="true"]{outline-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .ph{aspect-ratio:auto;height:100%;padding:0}
.caption{font-size:13px;color:var(--muted);padding:0 44px 24px 28px;margin:0}
@media (max-width:899px){.caption{padding:0 16px 18px}}
.info{background:var(--panel);padding:20px 44px 56px;overflow-y:auto;min-height:0}
@media (max-width:899px){.info{padding:20px 16px 44px}}
.info h2{font-size:clamp(28px,2.6vw,40px);line-height:1.15;letter-spacing:-.02em;font-weight:400;margin:48px 0 10px}
.info .by{color:var(--muted);margin:0;font-size:18px}
.info h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;color:var(--muted);margin:40px 0 12px}
.info p{margin:0 0 12px;font-size:16px}
.info dl{display:grid;grid-template-columns:auto 1fr;margin:0;font-size:15px;border-top:1px solid var(--line)}
.info dt,.info dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.info dt{color:var(--muted);padding-right:24px}
.note{border-left:1px solid var(--muted);padding:2px 0 2px 16px;margin:0 0 16px}
.note b{display:block;font-size:14px;font-weight:500}
.note p{font-size:16px;margin:4px 0 0}
.info .chips{margin-top:0}
.info .chip{color:var(--ink);font-size:16px;white-space:normal;text-align:left}
.info .chip:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.links{display:flex;flex-direction:column;gap:8px;font-size:16px;word-break:break-word}
.links a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.links a:hover{text-decoration:none}
.fine{font-size:13px;color:var(--muted)}
.closebar{position:sticky;top:0;display:flex;justify-content:flex-end;gap:26px;padding:6px 0 10px;background:var(--panel);font-size:16px}
.iconbtn{border:0;background:none;padding:0;cursor:pointer}
.iconbtn:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.iconbtn:disabled{color:var(--muted);cursor:default;text-decoration:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:12px 18px;font-size:15px;transition:transform .25s ease,opacity .25s ease,visibility .25s;z-index:20;max-width:calc(100vw - 32px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
footer{color:var(--muted);font-size:14px;padding-top:22px;padding-bottom:48px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site-head">
  <div class="util wrap">
    <span class="stats-text" id="stats">Loading collection…</span>
    <span class="right">
      <span class="live off" id="live"><i></i><span>Connecting</span></span>
      <button class="linkbtn searchicon" id="searchbtn" type="button" aria-label="Search the collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="M15.6 15.6 21 21"/></svg></button>
    </span>
  </div>
  <nav class="nav wrap" aria-label="Collection views">
    <button class="linkbtn" type="button" data-nav="all">Collection</button>
    <button class="linkbtn" type="button" data-nav="creator">Artists</button>
    <a class="mark" href="./">art inspo</a>
    <button class="linkbtn" type="button" data-nav="newest">Newest</button>
    <button class="linkbtn" type="button" data-nav="tags">Tags</button>
  </nav>
</header>

<section class="hero" id="hero" hidden></section>

<div class="sec-head wrap" id="collection">
  <h1>Collection</h1>
  <span class="count-all" id="countall"></span>
</div>
<div class="controls">
  <div class="wrap">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Search titles, artists, tags, notes" aria-label="Search">
      <select id="group" aria-label="Group"><option value="">All groups</option></select>
      <select id="sort" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="creator">Artist A–Z</option>
        <option value="title">Title A–Z</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="result-line" id="result"></div>
  </div>
</div>

<main class="wrap"><div class="grid" id="grid"></div><div id="msg"></div></main>
<footer class="wrap">Built from <a href="catalog.json">catalog.json</a>. Add references with <code>scripts/archive_reference.py</code> and this page picks them up automatically.</footer>

<dialog id="dlg" aria-label="Artwork details"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const CATALOG = 'catalog.json';
  const POLL_MS = 10000;
  const TAG_LIMIT = 18;
  const $ = (s) => document.querySelector(s);

  const state = {
    raw: '', refs: [], byId: new Map(), fresh: new Set(),
    q: '', tag: '', group: '', sort: 'newest', showAllTags: false,
    current: null, imgIndex: 0,
  };

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const isWebUrl = (u) => typeof u === 'string' && /^https?:\/\//i.test(u) && !/^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)[:/]/i.test(u);
  const localPath = (p) => p.split('/').map(encodeURIComponent).join('/');
  const asList = (v) => Array.isArray(v) ? v : (v ? [v] : []);
  const groupsOf = (r) => [...new Set(asList(r.page_records).map((p) => p.category).filter(Boolean))];

  function imagesOf(r) {
    const imgs = asList(r.images).filter((i) => i && i.path);
    if (imgs.length) return imgs;
    return asList(r.local_asset_paths).map((p) => ({ path: p, caption: r.title }));
  }

  // Local cached file first; fall back to the original web image if the file isn't in this folder.
  function sourcesOf(img) {
    const out = [];
    if (img.path) out.push(localPath(img.path));
    for (const u of [img.original_image_url, img.cached_from_url]) if (isWebUrl(u)) out.push(u);
    return [...new Set(out)];
  }

  function picture(img, alt, opts = {}) {
    const srcs = img ? sourcesOf(img) : [];
    const placeholder = () => h('div', { class: 'ph' }, opts.thumb ? '' : 'Image not in this folder yet');
    if (!srcs.length) return placeholder();
    let i = 0;
    const el = h('img', { src: srcs[0], alt: alt || '', loading: opts.eager ? 'eager' : 'lazy', decoding: 'async' });
    el.addEventListener('error', () => {
      i += 1;
      if (i < srcs.length) el.src = srcs[i];
      else el.replaceWith(placeholder());
    });
    return el;
  }

  function creatorLine(r) {
    const bits = [];
    if (r.creator) bits.push(r.creator);
    const date = r.work_date || r.year;
    if (date) bits.push(date);
    if (!bits.length) bits.push('Artist unknown');
    return bits.join(' · ');
  }

  function haystack(r) {
    return [
      r.id, r.title, r.creator, r.creator_alias, r.type, r.work_date, r.medium, r.client,
      asList(r.tags).join(' '), groupsOf(r).join(' '), r.visual_observations,
      asList(r.user_comments).join(' '),
      asList(r.page_records).map((p) => [p.title, p.credit, p.editorial_description].join(' ')).join(' '),
      imagesOf(r).map((i) => [i.caption, i.credit].join(' ')).join(' '),
    ].filter(Boolean).join(' ').toLowerCase();
  }

  // ---------- data ----------
  async function load(initial) {
    let text;
    try {
      const res = await fetch(CATALOG + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      text = await res.text();
      setLive(true);
    } catch (err) {
      setLive(false);
      if (initial) showLoadError();
      return;
    }
    if (text === state.raw) return;
    let data;
    try { data = JSON.parse(text); } catch { return; } // mid-write; try again next tick
    const before = new Set(state.byId.keys());
    state.raw = text;
    state.refs = asList(data.references);
    state.byId = new Map(state.refs.map((r) => [r.id, r]));
    state.refs.forEach((r) => { r._hay = haystack(r); });
    if (!initial) {
      const added = state.refs.filter((r) => !before.has(r.id));
      added.forEach((r) => state.fresh.add(r.id));
      toast(added.length ? `${added.length} new ${added.length === 1 ? 'work' : 'works'} added` : 'Collection updated');
    }
    renderFilters();
    render();
    if (state.current && state.byId.has(state.current)) openDetail(state.current, state.imgIndex, true);
    else if (initial) routeFromHash();
  }

  function setLive(ok) {
    const el = $('#live');
    el.classList.toggle('off', !ok);
    el.lastElementChild.textContent = ok ? 'Live · updates automatically' : 'Offline';
  }

  function showLoadError() {
    $('#stats').textContent = 'Could not load catalog.json';
    $('#msg').replaceChildren(h('div', { class: 'notice' },
      h('p', {}, 'This page reads ', h('code', {}, 'catalog.json'), ' from the same folder.'),
      h('p', {}, 'If you opened the file directly, run ', h('code', {}, 'python3 -m http.server 8000'),
        ' in the folder and visit ', h('code', {}, 'http://localhost:8000'), '.')));
  }

  // ---------- filters ----------
  function renderFilters() {
    const imgs = state.refs.reduce((n, r) => n + imagesOf(r).length, 0);
    const latest = state.refs.map((r) => r.date_updated || r.date_added).filter(Boolean).sort().pop();
    $('#stats').textContent = `${state.refs.length} works · ${imgs} pictures` + (latest ? ` · last change ${latest}` : '');
    $('#countall').textContent = `${state.refs.length} works`;
    renderHero();

    const groupSel = $('#group');
    const counts = new Map();
    state.refs.forEach((r) => { const g = groupsOf(r); (g.length ? g : ['Other references']).forEach((x) => counts.set(x, (counts.get(x) || 0) + 1)); });
    const prev = state.group;
    groupSel.replaceChildren(h('option', { value: '' }, 'All groups'),
      ...[...counts].map(([g, n]) => h('option', { value: g }, `${g} (${n})`)));
    groupSel.value = counts.has(prev) ? prev : '';
    state.group = groupSel.value;

    renderChips();
  }

  // Latest addition, shown like a feature: picture on white, text on gray.
  function renderHero() {
    const hero = $('#hero');
    const r = [...state.refs].sort(SORTS.newest)[0];
    hero.hidden = !r;
    if (!r) return;
    const open = () => openDetail(r.id);
    const desc = String(r.visual_observations || '').split(/\n\s*\n/)[0];
    hero.replaceChildren(
      h('button', { class: 'hero-img', type: 'button', 'aria-label': `Open ${r.title}`, onclick: open }, picture(imagesOf(r)[0], r.title, { eager: true })),
      h('div', { class: 'hero-side' }, h('div', {},
        h('p', { class: 'label' }, 'Latest addition'),
        h('button', { class: 'linkbtn t', type: 'button', onclick: open }, r.title || r.id),
        h('p', { class: 'by' }, creatorLine(r)),
        desc && h('p', { class: 'desc' }, desc),
        h('button', { class: 'linkbtn more', type: 'button', onclick: open }, 'View work'))));
  }

  function renderChips() {
    const counts = new Map();
    state.refs.forEach((r) => asList(r.tags).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
    let tags = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const hidden = Math.max(0, tags.length - TAG_LIMIT);
    if (!state.showAllTags) {
      const top = tags.slice(0, TAG_LIMIT);
      if (state.tag && !top.some(([t]) => t === state.tag)) top.push(tags.find(([t]) => t === state.tag));
      tags = top.filter(Boolean);
    }
    const chips = tags.map(([t, n]) => h('button', {
      class: 'chip', type: 'button', 'aria-pressed': String(state.tag === t),
      onclick: () => { state.tag = state.tag === t ? '' : t; renderChips(); render(); },
    }, t.replace(/-/g, ' '), h('small', {}, n)));
    if (hidden) chips.push(h('button', { class: 'chip more', type: 'button', onclick: () => { state.showAllTags = !state.showAllTags; renderChips(); render(); } },
      state.showAllTags ? 'Fewer tags' : `+${hidden} more tags`));
    $('#chips').replaceChildren(...chips);
  }

  const SORTS = {
    newest: (a, b) => (b.date_added || '').localeCompare(a.date_added || '') || b.id.localeCompare(a.id),
    oldest: (a, b) => (a.date_added || '').localeCompare(b.date_added || '') || a.id.localeCompare(b.id),
    creator: (a, b) => (a.creator || '￿').localeCompare(b.creator || '￿') || a.title.localeCompare(b.title),
    title: (a, b) => (a.title || '').localeCompare(b.title || ''),
  };

  function filtered() {
    const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const list = state.refs.filter((r) => {
      if (state.tag && !asList(r.tags).includes(state.tag)) return false;
      if (state.group) {
        const g = groupsOf(r);
        if (state.group === 'Other references' ? g.length : !g.includes(state.group)) return false;
      }
      return words.every((w) => r._hay.includes(w));
    });
    return list.sort(SORTS[state.sort]);
  }

  // ---------- grid ----------
  let shown = [];
  function render() {
    shown = filtered();
    document.querySelectorAll('[data-nav]').forEach((b) => {
      const k = b.dataset.nav;
      const on = k === 'all' ? !(state.q || state.tag || state.group) && state.sort === 'newest'
        : k === 'creator' || k === 'newest' ? state.sort === k : state.showAllTags;
      b.setAttribute('aria-current', String(on && k !== 'all' ? true : false));
    });
    const cards = shown.map((r) => {
      const imgs = imagesOf(r);
      return h('button', { class: 'card', type: 'button', 'data-id': r.id, onclick: () => openDetail(r.id) },
        h('span', { class: 'pic' }, picture(imgs[0], r.title)),
        state.fresh.has(r.id) && h('span', { class: 'badge' }, 'New'),
        imgs.length > 1 && h('span', { class: 'count' }, `${imgs.length} views`),
        h('span', { class: 'meta' }, h('span', { class: 't' }, r.title || r.id), h('span', { class: 'c' }, creatorLine(r))));
    });
    $('#grid').replaceChildren(...cards);
    $('#msg').replaceChildren(shown.length || !state.refs.length ? '' : h('div', { class: 'empty' }, 'Nothing matches these filters.'));

    const active = state.q || state.tag || state.group;
    $('#result').replaceChildren(active
      ? h('span', {}, `Showing ${shown.length} of ${state.refs.length} · `, h('button', { type: 'button', onclick: clearFilters }, 'Clear filters'))
      : '');
  }

  function clearFilters() {
    state.q = ''; state.tag = ''; state.group = '';
    $('#q').value = ''; $('#group').value = '';
    renderChips(); render();
  }

  // ---------- detail ----------
  const dlg = $('#dlg');

  function openDetail(id, imgIndex = 0, keepScroll = false) {
    const r = state.byId.get(id);
    if (!r) return;
    state.current = id;
    const imgs = imagesOf(r);
    state.imgIndex = Math.min(imgIndex, Math.max(0, imgs.length - 1));
    const info = dlg.querySelector('.info');
    const scroll = keepScroll && info ? info.scrollTop : 0;
    dlg.replaceChildren(buildDetail(r, imgs));
    if (!dlg.open) dlg.showModal();
    dlg.querySelector('.info').scrollTop = scroll;
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    state.fresh.delete(id);
    const badge = document.querySelector(`.card[data-id="${CSS.escape(id)}"] .badge`);
    if (badge) badge.remove();
  }

  function buildDetail(r, imgs) {
    const img = imgs[state.imgIndex];
    const stage = h('div', { class: 'stage' },
      h('div', { class: 'main-img' }, picture(img, img && img.caption || r.title, { eager: true })),
      imgs.length > 1 && h('div', { class: 'thumbs' }, imgs.map((im, i) => h('button', {
        type: 'button', 'aria-label': `View ${i + 1}`, 'aria-current': String(i === state.imgIndex),
        onclick: () => openDetail(r.id, i, true),
      }, picture(im, '', { thumb: true })))),
      img && (img.caption || img.credit) && h('p', { class: 'caption' }, [img.caption, img.credit].filter(Boolean).join(' — ')));

    const facts = [
      ['Artist', r.creator], ['Also known as', r.creator_alias], ['Date', r.work_date || r.year],
      ['Type', r.type], ['Medium', r.medium], ['Size', typeof r.dimensions === 'string' ? r.dimensions : null],
      ['Client', r.client], ['Collection', r.museum_credit], ['Department', r.department], ['Object no.', r.object_number],
      ['Groups', groupsOf(r).join(', ')], ['Added', r.date_added], ['Updated', r.date_updated], ['ID', r.id],
    ].filter(([, v]) => v);

    const links = [];
    const seen = new Set();
    const addLink = (url, label) => { if (isWebUrl(url) && !seen.has(url)) { seen.add(url); links.push(h('a', { href: url, target: '_blank', rel: 'noopener' }, label || new URL(url).hostname.replace(/^www\./, '') + ' ↗')); } };
    asList(r.page_records).forEach((p) => asList(p.links).forEach((l) => addLink(l.url)));
    addLink(r.source_url);
    asList(r.source_urls).forEach((u) => addLink(u));
    imgs.forEach((i) => addLink(i.source_page));
    if (r.note_path) links.push(h('a', { href: localPath(r.note_path) }, 'Full note (Markdown)'));

    const idx = shown.findIndex((x) => x.id === r.id);
    const prev = idx > 0 ? shown[idx - 1] : null;
    const next = idx >= 0 && idx < shown.length - 1 ? shown[idx + 1] : null;

    const info = h('div', { class: 'info' },
      h('div', { class: 'closebar' },
        h('button', { class: 'iconbtn', type: 'button', disabled: !prev, 'aria-label': 'Previous', onclick: () => prev && openDetail(prev.id) }, 'Previous'),
        h('button', { class: 'iconbtn', type: 'button', disabled: !next, 'aria-label': 'Next', onclick: () => next && openDetail(next.id) }, 'Next'),
        h('button', { class: 'iconbtn', type: 'button', onclick: closeDetail }, 'Close')),
      h('h2', {}, r.title || r.id),
      h('p', { class: 'by' }, creatorLine(r)),
      asList(r.user_comments).length > 0 && [h('h3', {}, 'Your notes'), asList(r.user_comments).map((c) => h('div', { class: 'note' }, h('p', {}, c)))],
      r.visual_observations && [h('h3', {}, 'What it looks like'), String(r.visual_observations).split(/\n\s*\n/).map((p) => h('p', {}, p))],
      asList(r.page_records).filter((p) => p.editorial_description).length > 0 && [h('h3', {}, 'From the source page'),
        asList(r.page_records).filter((p) => p.editorial_description).map((p) => h('div', { class: 'note' },
          h('b', {}, [p.title, p.credit].filter(Boolean).join(' — ')), h('p', {}, p.editorial_description)))],
      r.preference_signals && [h('h3', {}, 'Why it is here'), h('p', {}, r.preference_signals)],
      asList(r.tags).length > 0 && [h('h3', {}, 'Tags'), h('div', { class: 'chips' }, asList(r.tags).map((t) => h('button', {
        class: 'chip', type: 'button', onclick: () => { state.tag = t; closeDetail(); renderChips(); render(); toCollection(); },
      }, t.replace(/-/g, ' '))))],
      asList(r.related_reference_ids).filter((x) => state.byId.has(x)).length > 0 && [h('h3', {}, 'Related'),
        h('div', { class: 'chips' }, asList(r.related_reference_ids).filter((x) => state.byId.has(x)).map((x) => h('button', {
          class: 'chip', type: 'button', onclick: () => openDetail(x),
        }, state.byId.get(x).title)))],
      facts.length > 0 && [h('h3', {}, 'Details'), h('dl', {}, facts.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))],
      links.length > 0 && [h('h3', {}, 'Links'), h('div', { class: 'links' }, links)],
      (r.attribution_status || r.selection_status) && h('p', { class: 'fine', style: 'margin-top:22px' }, [r.attribution_status, r.selection_status].filter(Boolean).join(' ')));

    return h('div', { class: 'detail' }, stage, info);
  }

  function closeDetail() {
    state.current = null;
    if (dlg.open) dlg.close();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  function routeFromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && state.byId.has(id)) openDetail(id);
  }

  dlg.addEventListener('close', () => { if (state.current) closeDetail(); });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDetail(); });
  document.addEventListener('keydown', (e) => {
    if (!dlg.open || !state.current) return;
    const r = state.byId.get(state.current);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const idx = shown.findIndex((x) => x.id === state.current);
      const to = shown[idx + (e.key === 'ArrowRight' ? 1 : -1)];
      if (to) openDetail(to.id);
    } else if ((e.key === ']' || e.key === '[') && r) {
      const n = imagesOf(r).length;
      openDetail(r.id, (state.imgIndex + (e.key === ']' ? 1 : n - 1)) % n, true);
    }
  });
  window.addEventListener('hashchange', routeFromHash);

  // ---------- controls ----------
  let qTimer;
  $('#q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
  $('#group').addEventListener('change', (e) => { state.group = e.target.value; render(); });
  $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

  // Header links are shortcuts into the collection.
  function setSort(v) { state.sort = v; $('#sort').value = v; }
  function toCollection() { $('#collection').scrollIntoView({ behavior: 'smooth' }); }
  document.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.nav;
    if (k === 'all') { setSort('newest'); state.showAllTags = false; clearFilters(); }
    else if (k === 'creator' || k === 'newest') { setSort(k); render(); }
    else if (k === 'tags') { state.showAllTags = true; renderChips(); render(); }
    toCollection();
  }));
  $('#searchbtn').addEventListener('click', () => { toCollection(); setTimeout(() => $('#q').focus({ preventScroll: true }), 350); });

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ---------- live updates ----------
  load(true);
  setInterval(() => { if (!document.hidden) load(false); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
})();
</script>
</body>
</html>
