<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/fonts.css"><style>
html,body{margin:0;padding:0;width:2048px;height:1024px;overflow:hidden;background:#070c30}
svg{position:absolute;left:0;top:0;display:block}
</style></head><body>
<!--
  NEWS 360 - spherical LED news ball, equirectangular texture 2048 x 1024.
  column u = (lon+180)/360*2048 (lon 0 = centre column, faces the viewer), row v = (90-lat)/180*1024 (row 0 = north pole).
  Everything that crosses lon +-180 is drawn twice (x and x+-2048) so the wrap is seamless.
-->
<svg id="s" width="2048" height="1024" viewBox="0 0 2048 1024"></svg>
<script>
const W = 2048, H = 1024, P = W / 360;
const X = lon => (lon + 180) * P, Y = lat => (90 - lat) * P;
const NS = 'http://www.w3.org/2000/svg';
const S = document.getElementById('s');
function el(tag, a, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (text != null) e.textContent = text;
  (parent || S).appendChild(e); return e;
}
const g = (a, p) => el('g', a || {}, p);
// deterministic random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const FONTS = ["900 100px 'Big Shoulders Display'", "400 100px 'Russo One'", "400 100px 'Dela Gothic One'"];
Promise.all(FONTS.map(f => document.fonts.load(f, 'NEWS 360 BREAKING 第七環ニュース速報 0123456789:'))).then(build, build);

function build() {
  // ---------------------------------------------------------------- defs
  const D = el('defs', {});
  D.innerHTML = `
  <linearGradient id="bgV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050a2a"/><stop offset=".17" stop-color="#0a1850"/>
    <stop offset=".205" stop-color="#0d1c6c"/><stop offset=".30" stop-color="#1a2fa4"/>
    <stop offset=".40" stop-color="#14258e"/><stop offset=".42" stop-color="#101e76"/>
    <stop offset=".58" stop-color="#0e1b6c"/><stop offset=".70" stop-color="#0a1452"/>
    <stop offset=".80" stop-color="#070d38"/><stop offset="1" stop-color="#03061a"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#4a7dff" stop-opacity=".75"/><stop offset=".55" stop-color="#3159f0" stop-opacity=".3"/>
    <stop offset="1" stop-color="#2a4be0" stop-opacity="0"/></radialGradient>
  <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fe2ff" stop-opacity=".8"/><stop offset=".4" stop-color="#3a9cff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#1f5cff" stop-opacity="0"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2233a"/><stop offset=".45" stop-color="#d9142c"/><stop offset="1" stop-color="#a80a1e"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8ff3ff"/><stop offset=".5" stop-color="#2fd2ff"/><stop offset="1" stop-color="#1596f0"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16298a"/><stop offset="1" stop-color="#0b175a"/></linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff2f9a" stop-opacity="0"/><stop offset=".7" stop-color="#e0208c" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ff5ab0" stop-opacity=".8"/></linearGradient>
  <filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <mask id="moonM" maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120">
    <circle r="36" fill="#fff"/><circle cx="17" cy="-12" r="31" fill="#000"/></mask>`;

  // ---------------------------------------------------------------- background
  el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#bgV)' });
  // broadcast glow behind the two logo copies (front lon 0, back lon 180 = x 0 and x 2048)
  for (const cx of [0, W / 2, W]) el('ellipse', { cx, cy: Y(36), rx: 520, ry: 150, fill: 'url(#glow)' });
  // faint diagonal light streaks in the broadcast zone (period 128 px -> divides 2048, seamless)
  const st = g({ opacity: .07 });
  for (let k = -3; k < 18; k++) {
    const x0 = k * 128;
    el('polygon', { points: `${x0},${Y(53)} ${x0 + 46},${Y(53)} ${x0 + 46 + 110},${Y(15)} ${x0 + 110},${Y(15)}`, fill: '#9fc4ff' }, st);
  }

  // ---------------------------------------------------------------- northern cap: globe (lat > 55)
  el('rect', { x: 0, y: 0, width: W, height: Y(55), fill: '#050b2e', opacity: .8 });
  // dot-matrix landmasses (rough arctic outlines, lon/lat) - dots evenly spaced on the sphere, seamless per row
  const LAND = [
    [[-168,54],[-160,58],[-166,62],[-165,67],[-157,71.3],[-141,69.6],[-128,70],[-115,68.5],[-100,68],[-94,69],[-87,68],[-82,66],[-86,64],[-91,63],[-94,60],[-93,57],[-85,55.3],[-82,53],[-79,54.5],[-77,59],[-78,62.3],[-73,62],[-69,59],[-65,60],[-61,56],[-56,52],[-131,52],[-135,57],[-140,59.5],[-150,59.5],[-153,57],[-160,55]],
    [[-124,71],[-110,72.5],[-95,72],[-85,70],[-75,72],[-65,75],[-62,80],[-70,83],[-90,81.5],[-110,78.5],[-122,76],[-125,73]],
    [[-90,70],[-80,73.5],[-67,70],[-62,66],[-68,62.5],[-74,64],[-80,64],[-88,68]],
    [[-73,78],[-60,82],[-30,83.5],[-18,81.5],[-20,75],[-22,70],[-33,66],[-42,60],[-48,61],[-52,65],[-55,70],[-58,75],[-68,76.5]],
    [[-24,64],[-22,66.4],[-15,66.5],[-13,65],[-19,63.4]],
    [[5,58],[5,62],[10,64],[14,67.5],[18,69.7],[25,71],[29,70.5],[28,68],[24,65.8],[21,64],[17.5,62],[19,60],[16.5,57],[13,55.5],[11,58.8],[8,58]],
    [[24,60],[22,63],[25,65],[29,69.5],[31,70],[41,67],[33,66],[35,64.5],[40,64.5],[44,66.5],[44,68.5],[54,68.5],[60,69.5],[68,69],[73,72.5],[80,72.5],[85,75],[100,77],[105,77.7],[113,73.7],[128,73],[140,72.5],[150,71.5],[160,70],[170,70],[180.5,69],[180.5,65],[178,62],[165,60],[162,57],[156,51],[155,57],[150,59.5],[142,59],[137,54.5],[135,52],[30,52],[4,52],[8,53.5],[8.2,57],[10.5,57.7],[11,54.2],[20,54.6],[21,57],[24,59]],
    [[-180.5,69],[-175,67.5],[-170,66],[-173,64.5],[-180.5,65]],
    [[52,71],[56,75.5],[68,77],[60,74],[55,71]], [[11,78],[16,80.5],[27,80.2],[22,77.5],[15,77]],
    [[45,80],[60,81.5],[65,80.5],[50,79.5]], [[93,78],[100,81],[106,79],[98,77.5]],
    [[-5,52],[-3,56],[-6,58.6],[-2,58.6],[-1.5,55],[1.5,52.8]], [[-10,52],[-10,54],[-7,55.3],[-6,53.5]]];
  // landmasses as soft lighter-navy shapes (equirect polygons; Chukotka is split at the seam so it wraps)
  const land = g({ opacity: .95 });
  for (const pl of LAND) el('polygon', { points: pl.map(([lo, la]) => `${X(lo)},${Y(Math.max(la, 55))}`).join(' '),
                                         fill: '#1a43a2', stroke: '#2b62d6', 'stroke-width': 8, 'stroke-linejoin': 'round' }, land);
  const gr = g({ filter: 'url(#gl)' });
  const LINE = '#3aaeff';
  // meridians every 30 deg, constant on-sphere width (widened by 1/cos(lat) in the texture), stop near the pole
  for (let lon = -180; lon <= 180; lon += 30) {
    const L = [], R = [];
    for (let lat = 55; lat <= 84.01; lat += 1) {
      const hw = Math.min(4.6 / Math.cos(lat * Math.PI / 180), 40);
      L.push(`${X(lon) - hw},${Y(lat)}`); R.unshift(`${X(lon) + hw},${Y(lat)}`);
    }
    el('polygon', { points: L.concat(R).join(' '), fill: LINE, opacity: .8 }, gr);
  }
  // parallels (horizontal lines in the texture) 9 px
  for (const lat of [64, 73, 81]) el('rect', { x: -20, y: Y(lat) - 4.5, width: W + 40, height: 9, fill: LINE, opacity: .8 }, gr);
  // the bright rim of the cap (lat 55)
  el('rect', { x: -20, y: Y(55) - 6, width: W + 40, height: 12, fill: '#62d4ff' }, gr);
  // glowing pole spot (lat > ~80), radial on the sphere = vertical gradient in the texture
  el('rect', { x: 0, y: 0, width: W, height: Y(79), fill: 'url(#pole)' });

  // ---------------------------------------------------------------- logo  (centred on lon 0, copy at lon 180)
  function logo(cx) {
    const pre = 1.14;                                   // horizontal pre-stretch (1/cos(lat) partly compensated)
    const G = g({ transform: `translate(${cx},0) scale(${pre},1)` });
    const base = Math.round(Y(31)), capH = 104, fs = capH / 0.81;   // Big Shoulders Display 900 cap height = .81 em
    // measure words
    const tN = el('text', { x: 0, y: base, 'font-family': 'Big Shoulders Display', 'font-weight': 900, 'font-size': fs, 'letter-spacing': 4 }, G, 'NEWS');
    const t3 = el('text', { x: 0, y: base, 'font-family': 'Big Shoulders Display', 'font-weight': 900, 'font-size': fs, 'letter-spacing': 4 }, G, '360');
    const wN = tN.getComputedTextLength(), w3 = t3.getComputedTextLength(), gap = 44;
    const tot = wN + gap + w3, xN = -tot / 2, x3 = xN + wN + gap;
    tN.remove(); t3.remove();
    // backing plate: a darker rounded slab so the white letters never sit on a bright glow
    el('rect', { x: xN - 34, y: base - capH - 22, width: tot + 68, height: capH + 44, rx: 26, fill: '#081250', opacity: .55 }, G);
    // orbit ring around "360": back half
    const rcx = x3 + w3 / 2, rcy = base - capH * 0.42, rx = w3 / 2 + 26, ry = 36;
    const ring = (sweepTop) => el('path', {
      d: `M${rcx - rx},${rcy} A${rx},${ry} 0 0 ${sweepTop ? 1 : 0} ${rcx + rx},${rcy}`,
      fill: 'none', stroke: '#ff3048', 'stroke-width': 12, 'stroke-linecap': 'round', transform: `rotate(-9 ${rcx} ${rcy})`
    }, G);
    ring(true).setAttribute('opacity', .85);
    // words
    const common = { y: base, 'font-family': 'Big Shoulders Display', 'font-weight': 900, 'font-size': fs, 'letter-spacing': 4, 'paint-order': 'stroke', 'stroke-linejoin': 'round' };
    el('text', Object.assign({ x: xN, fill: '#ffffff', stroke: '#06103c', 'stroke-width': 10 }, common), G, 'NEWS');
    el('text', Object.assign({ x: x3, fill: 'url(#cyan)', stroke: '#041038', 'stroke-width': 10 }, common), G, '360');
    // degree mark after 360 (drawn, not a glyph)
    el('circle', { cx: x3 + w3 + 16, cy: base - capH + 15, r: 13, fill: 'none', stroke: '#8ff3ff', 'stroke-width': 9 }, G);
    // orbit ring: front half + arrow head
    ring(false);
    const ang = -9 * Math.PI / 180, ex = rcx + rx * Math.cos(ang), ey = rcy + rx * Math.sin(ang);
    el('polygon', { points: `${ex - 22},${ey - 2} ${ex + 22},${ey - 6} ${ex + 2},${ey - 34}`, fill: '#ff3048', transform: `rotate(-9 ${ex} ${ey})` }, G);

    // ---- LIVE badge + clock strip under the logo (lat ~16..28)
    const sb = Math.round(Y(16.3)), sh = 68, stop = sb - sh;            // strip bottom/top rows
    const G2 = g({ transform: `translate(${cx},0) scale(1.07,1)` });
    const tl = el('text', { x: 0, y: 0, 'font-family': 'Russo One', 'font-size': 62 }, G2, 'LIVE');
    const tc = el('text', { x: 0, y: 0, 'font-family': 'Russo One', 'font-size': 66 }, G2, '23:47');
    const wl = tl.getComputedTextLength(), wc = tc.getComputedTextLength(); tl.remove(); tc.remove();
    const bw = wl + 104, cw = wc + 44, tot2 = bw + 22 + cw, bx = -tot2 / 2, cx2 = bx + bw + 22;
    el('rect', { x: bx, y: stop, width: bw, height: sh, rx: 12, fill: '#e3142d' }, G2);
    el('circle', { cx: bx + 40, cy: stop + sh / 2, r: 15, fill: '#ffffff' }, G2);
    el('text', { x: bx + 70, y: stop + sh / 2 + 22, 'font-family': 'Russo One', 'font-size': 62, fill: '#ffffff' }, G2, 'LIVE');
    el('rect', { x: cx2, y: stop, width: cw, height: sh, rx: 12, fill: '#050b2e', stroke: '#2f5cff', 'stroke-width': 7 }, G2);
    el('text', { x: cx2 + 22, y: stop + sh / 2 + 23, 'font-family': 'Russo One', 'font-size': 66, fill: '#ffc22e' }, G2, '23:47');
    // horizontal extent of this logo copy relative to cx (texture px): slab / ring / arrow head (+ ring stroke)
    const b1 = G.getBBox(), b2 = G2.getBBox();
    return { L: Math.min(pre * b1.x, 1.07 * b2.x) - 6, R: Math.max(pre * (b1.x + b1.width), 1.07 * (b2.x + b2.width)) + 6 };
  }
  let ext = null;
  for (const cx of [0, W / 2, W]) ext = logo(cx);

  // ---------------------------------------------------------------- side items centred in the two gaps between the logos
  // left gap: back copy (cx 0) right edge .. front copy (cx W/2) left edge; right gap: front right edge .. back copy (cx W) left edge
  {
    const base = Math.round(Y(30)), fs = 92, M = 18, preMax = 1.15;
    const gl0 = ext.R, gl1 = W / 2 + ext.L, gr0 = W / 2 + ext.R, gr1 = W + ext.L;
    const cL = (gl0 + gl1) / 2, wL = gl1 - gl0 - 2 * M, cR = (gr0 + gr1) / 2, wR = gr1 - gr0 - 2 * M;
    const G = g({});
    const t = el('text', { x: 0, y: base, 'font-family': 'Dela Gothic One', 'font-size': fs, 'text-anchor': 'middle', fill: '#5a0612' }, G, '速報');
    const w = t.getComputedTextLength(); t.remove();
    el('rect', { x: -w / 2 - 26, y: base - fs * 0.86, width: w + 52, height: fs * 1.08, rx: 14, fill: '#ffcf2e' }, G);
    G.appendChild(t);
    const preL = Math.min(preMax, wL / (w + 52));
    G.setAttribute('transform', `translate(${cL},0) scale(${preL},1)`);
    const G2 = g({});
    const t2 = el('text', { x: 0, y: base, 'font-family': 'Dela Gothic One', 'font-size': 80, 'text-anchor': 'middle', fill: '#ffffff', stroke: '#06103c', 'stroke-width': 8, 'paint-order': 'stroke' }, G2, '第七環');
    const preR = Math.min(preMax, wR / (t2.getComputedTextLength() + 8));
    G2.setAttribute('transform', `translate(${cR},0) scale(${preR},1)`);
    document.documentElement.dataset.side = JSON.stringify({ ext, gapL: [gl0, gl1], gapR: [gr0, gr1], cL, cR, preL, preR,
      lonL: cL / P - 180, lonR: cR / P - 180 });
  }

  // ---------------------------------------------------------------- red equatorial ticker (lat -14..+14), 360 deg seamless
  const bT = Math.round(Y(14)), bB = Math.round(Y(-14));
  el('rect', { x: 0, y: bT, width: W, height: bB - bT, fill: 'url(#red)' });
  el('rect', { x: 0, y: bT, width: W, height: 9, fill: '#ff9aa6' });
  el('rect', { x: 0, y: bB - 10, width: W, height: 10, fill: '#5e0614' });
  {
    // one loop of the ticker is laid out, measured and scaled to exactly 2048 px, then drawn twice (offset 2048)
    const fsL = 114, fsJ = 92, baseY = Math.round((bT + bB) / 2 + fsL * 0.81 / 2);
    const items = [
      ['L', 'BREAKING', '#ffe24a'], ['S'], ['L', 'NIGHT MARKET OPENS', '#ffffff'], ['S'],
      ['J', '第七環ニュース', '#ffffff'], ['S']];
    const SEPW = 50, PAD = 30;
    const tmp = g({});
    let x = 0; const placed = [];
    for (const it of items) {
      if (it[0] === 'S') { x += PAD; placed.push(['S', x]); x += SEPW + PAD; continue; }
      const a = it[0] === 'L' ? { 'font-family': 'Big Shoulders Display', 'font-weight': 900, 'font-size': fsL, 'letter-spacing': 3 }
                              : { 'font-family': 'Dela Gothic One', 'font-size': fsJ };
      const t = el('text', Object.assign({ x: 0, y: baseY }, a), tmp, it[1]);
      const w = t.getComputedTextLength(); placed.push(['T', x, it[1], it[2], a]); x += w;
    }
    tmp.remove();
    const unit = x, sx = W / unit;
    document.documentElement.dataset.tickerScale = sx.toFixed(3);
    const off = Math.round(X(-30));                       // "BREAKING" starts at lon -36 -> front of the ball
    for (const o of [off - W, off, off + W]) {
      const G = g({ transform: `translate(${o},0) scale(${sx},1)` });
      for (const p of placed) {
        if (p[0] === 'S') el('polygon', { points: `${p[1]},${baseY - 74} ${p[1] + SEPW},${baseY - 37} ${p[1]},${baseY}`, fill: '#ffd23a' }, G);
        else el('text', Object.assign({ x: p[1], y: p[4]['font-family'] === 'Dela Gothic One' ? baseY - 4 : baseY, fill: p[3] }, p[4]), G, p[2]);
      }
    }
  }

  // ---------------------------------------------------------------- weather strip below the band (lat -16..-39)
  const wT = Math.round(Y(-16.5)), wH = 124;
  const WX = [['rain', 16, '#7fd0ff'], ['cloud', 19, '#ffb627'], ['storm', 22, '#ffb627'], ['rain', 17, '#7fd0ff'],
              ['moon', 18, '#ffb627'], ['sun', 24, '#ffb627'], ['cloudmoon', 21, '#ffb627'], ['moon', 15, '#7fd0ff']];
  function icon(kind, G) {
    const cloud = (c) => { el('circle', { cx: -14, cy: 4, r: 26, fill: c }, G); el('circle', { cx: 14, cy: -6, r: 30, fill: c }, G);
                           el('rect', { x: -40, y: 4, width: 80, height: 26, rx: 13, fill: c }, G); };
    if (kind === 'sun') { for (let i = 0; i < 8; i++) el('rect', { x: -5, y: -50, width: 10, height: 18, rx: 4, fill: '#ffc21a', transform: `rotate(${i * 45})` }, G);
                          el('circle', { r: 26, fill: '#ffd23a' }, G); }
    if (kind === 'moon') el('circle', { r: 36, fill: '#ffe9a6', mask: 'url(#moonM)' }, G);
    if (kind === 'cloudmoon') { const m = g({ transform: 'translate(16,-16) scale(.8)' }, G); el('circle', { r: 36, fill: '#ffe9a6', mask: 'url(#moonM)' }, m); cloud('#c9d4ff'); }
    if (kind === 'cloud') cloud('#d6ddff');
    if (kind === 'rain') { const c = g({ transform: 'translate(0,-12)' }, G); cloud('#c3cdf5');
                           for (const dx of [-22, 0, 22]) el('line', { x1: dx + 6, y1: 34, x2: dx - 4, y2: 54, stroke: '#4fb3ff', 'stroke-width': 9, 'stroke-linecap': 'round' }, G); }
    if (kind === 'storm') { cloud('#aeb8e6'); el('polygon', { points: '4,18 -14,48 0,48 -8,70 20,36 6,36 16,18', fill: '#ffd23a' }, G); }
  }
  for (let k = 0; k <= 8; k++) {
    const cx = k * 256, [kind, temp, col] = WX[k % 8];
    const G = g({ transform: `translate(${cx},0)` });
    el('rect', { x: -116, y: wT, width: 232, height: wH, rx: 16, fill: 'url(#tile)', stroke: '#2d58e6', 'stroke-width': 8 }, G);
    icon(kind, g({ transform: `translate(-58,${wT + wH / 2 - 4})` }, G));
    const t = el('text', { x: 46, y: wT + wH / 2 + 40, 'text-anchor': 'middle', 'font-family': 'Big Shoulders Display', 'font-weight': 900, 'font-size': 100, fill: col }, G, String(temp));
    const tw = t.getComputedTextLength();
    el('circle', { cx: 46 + tw / 2 + 14, cy: wT + wH / 2 - 30, r: 9, fill: 'none', stroke: col, 'stroke-width': 7 }, G);
  }

  // ---------------------------------------------------------------- skyline "video" strip (lat -39..-52), seamless
  const hT = Math.round(Y(-39.5)), hB = Math.round(Y(-52));
  el('rect', { x: 0, y: hT, width: W, height: hB - hT, fill: 'url(#horizon)' });
  const sk = g({});
  let bx = 0; seed = 11;
  while (bx < W) {
    const bw = 34 + Math.floor(rnd() * 70), bh = 22 + Math.floor(rnd() * (hB - hT - 18));
    const col = ['#1a0838', '#22094a', '#150530'][Math.floor(rnd() * 3)];
    for (const dx of [0, -W]) {
      const x0 = bx + dx; if (x0 + bw < 0) continue;
      el('rect', { x: x0, y: hB - bh, width: bw - 7, height: bh, fill: col }, sk);
    }
    const wins = [];
    for (let yy = hB - bh + 10; yy < hB - 12; yy += 16) for (let xx = 8; xx < bw - 14; xx += 15) if (rnd() < .38) wins.push([xx, yy]);
    const wc = rnd() < .5 ? '#ffcf6b' : '#7fe6ff';
    for (const dx of [0, -W]) for (const [xx, yy] of wins) if (bx + dx + xx > -10) el('rect', { x: bx + dx + xx, y: yy, width: 7, height: 7, fill: wc }, sk);
    bx += bw;
  }
  el('rect', { x: 0, y: hB, width: W, height: 10, fill: '#ff4fae', opacity: .7 });

  // ---------------------------------------------------------------- southern cap (never seen from above): faint graticule
  const sc = g({ opacity: .35 });
  for (const lat of [-62, -72, -82]) el('rect', { x: 0, y: Y(lat) - 5, width: W, height: 10, fill: '#2a6bff' }, sc);
  document.documentElement.dataset.done = '1';
}
</script>
</body></html>
